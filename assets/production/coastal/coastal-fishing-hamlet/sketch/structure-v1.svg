<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">湾口救人战的岸上聚落识别物，表现渔</text><text x="1050" y="237" class="small">民生计与火势威胁；不把远景屋群都变</text><text x="1050" y="266" class="small">成可进入建筑。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">1629虚构福建湾岸；平常与受火节点</text><text x="1050" y="458" class="small">可切换，渔具货具另引。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a4_s7</text>
