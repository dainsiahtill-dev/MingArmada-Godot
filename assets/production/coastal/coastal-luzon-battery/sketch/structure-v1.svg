<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">白旗下面一场明写前方炮台影子与退出</text><text x="1050" y="237" class="small">炮台正面，只需威胁方向和远景轮廓。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">1625虚构接触中的未具名吕宋岸段；</text><text x="1050" y="458" class="small">低矮土石防御台与炮口朝海的远景剪影</text><text x="1050" y="487" class="small">，尺度只按能辨方向的背景设计；不复</text><text x="1050" y="516" class="small">制特定马尼拉堡垒，不补未经考证炮位</text><text x="1050" y="545" class="small">数。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
