<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">货栈铺位与养伤小间：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。澳门旧铺及阿旺养伤的有限室内；服从剧情和对话镜头，不扩成可自由漫游旅馆。所有符号与部件均为设计关系表达。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a86040"/></marker></defs>
<style>
svg{background:#f6f2e8}text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-size:22px;fill:#273d40;stroke:none}path,rect,polygon,line,circle{stroke:#273d40;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#637573}.tag{font-size:21px;font-weight:700}.small{font-size:18px}.fine{stroke-width:1.3;opacity:.7}.leader{stroke:#637573;stroke-width:1.6;fill:none}.route{stroke:#a86040;stroke-width:4;fill:none}.route-label{font-size:20px;fill:#a86040}.interface{stroke-dasharray:8 7;stroke:#557c88}.shallow{stroke:#b9d5d0;stroke-width:17;stroke-dasharray:15 8;fill:none}.waterline{stroke:#557c88;stroke-width:2;stroke-dasharray:13 9}.rope{stroke:#a86040;stroke-width:2;stroke-dasharray:6 5;fill:none}.swing{stroke:#a86040;stroke-dasharray:8 8;fill:none}.silhouette{stroke-dasharray:13 9;stroke:#637573;stroke-width:2}.ground{stroke-width:3}.window{stroke:#557c88;stroke-width:7}.drip{stroke:#557c88;stroke-dasharray:7 9;stroke-width:4}.anchor-zone{stroke:#557c88;stroke-dasharray:8 10;stroke-width:1.5}.search{stroke:#557c88;stroke-dasharray:10 8;stroke-width:2}.contour{stroke:#637573;stroke-dasharray:7 6;stroke-width:2}.horizon{stroke:#637573;stroke-width:2}.fog{stroke:#fffdf7;stroke-width:9;opacity:.7}.rain{stroke:#557c88;stroke-width:2}
</style>
<rect x="0" y="0" width="1440" height="1000" fill="#f6f2e8" stroke="none"/>
<text x="48" y="61" class="title">货栈铺位与养伤小间</text>
<text x="49" y="98" class="subtitle">building-warehouse-berth · 构件与装配关系</text>
<line x1="48" y1="122" x2="1390" y2="122" stroke="#637573" stroke-width="1"/>
<rect x="48" y="146" width="970" height="694" fill="#fffdf7" stroke="#c7c9bd" stroke-width="1.2"/>
<g transform="translate(50 155)"><rect x="145" y="120" width="650" height="430" fill="#ddcda9" /><rect x="165" y="140" width="355" height="390" fill="#fffdf7" /><text x="342.5" y="342" text-anchor="middle"><tspan x="342.5" dy="0">旧铺小间</tspan></text><line x1="465" y1="530" x2="510" y2="530" stroke="#f6f2e8" stroke-width="7"/><rect x="520" y="140" width="255" height="215" fill="#d9c3a0" /><text x="647.5" y="254.5" text-anchor="middle"><tspan x="647.5" dy="0">工具暂存</tspan></text><line x1="720" y1="355" x2="765" y2="355" stroke="#f6f2e8" stroke-width="7"/><rect x="195" y="180" width="120" height="220" fill="#d9c3a0" /><text x="204" y="430" ><tspan x="204" dy="0">床铺另引</tspan></text><line x1="350" y1="170" x2="480" y2="170" class="window"/><path d="M875 535L610 535L585 425L450 430" fill="none" class="route" marker-end="url(#arrow)" /><text x="605" y="600" class="route-label"><tspan x="605" dy="0">门口至旧铺</tspan></text><g transform="translate(725 445) rotate(180)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="705" y="485" class="small"><tspan x="705" dy="0">门口镜头</tspan></text><line x1="225" y1="268" x2="70" y2="70" class="leader"/><circle cx="225" cy="268" r="4" fill="#a86040" stroke="none"/><text x="78" y="64" text-anchor="start"><tspan x="78" dy="0">窄铺位</tspan></text><line x1="607" y1="185" x2="747" y2="85" class="leader"/><circle cx="607" cy="185" r="4" fill="#a86040" stroke="none"/><text x="755" y="79" text-anchor="start"><tspan x="755" dy="0">工具不并入墙体</tspan></text><text x="150" y="640" class="small"><tspan x="150" dy="0">有限室内平面；养伤与失位用陈设变化，不增另一座旅馆</tspan></text></g>
<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">澳门旧铺及阿旺养伤的有限室内；服从</text><text x="1050" y="237" class="small">剧情和对话镜头，不扩成可自由漫游旅</text><text x="1050" y="266" class="small">馆。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">1621—约1623，木隔墙、粗灰泥、窄</text><text x="1050" y="458" class="small">门、可见梁底，旧铺与工具靠近出入口</text><text x="1050" y="487" class="small">；床铺被褥和工具箱由道具分册提供。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a1_s4</text>
