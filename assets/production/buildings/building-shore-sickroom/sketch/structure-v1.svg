<text x="49" y="98" class="subtitle">building-shore-sickroom · 构件与装配关系</text>
<line x1="48" y1="122" x2="1390" y2="122" stroke="#637573" stroke-width="1"/>
<rect x="48" y="146" width="970" height="694" fill="#fffdf7" stroke="#c7c9bd" stroke-width="1.2"/>
<g transform="translate(50 155)"><rect x="140" y="140" width="430" height="380" fill="#fffdf7" /><text x="355" y="337" text-anchor="middle"><tspan x="355" dy="0">养伤屋</tspan></text><line x1="515" y1="520" x2="560" y2="520" stroke="#f6f2e8" stroke-width="7"/><rect x="590" y="140" width="235" height="380" fill="#ddcda9" /><text x="707.5" y="337" text-anchor="middle"><tspan x="707.5" dy="0">檐下灶区</tspan></text><line x1="770" y1="520" x2="815" y2="520" stroke="#f6f2e8" stroke-width="7"/><rect x="175" y="185" width="115" height="220" fill="#d9c3a0" /><text x="174" y="442" ><tspan x="174" dy="0">卧具另引</tspan></text><circle cx="695" cy="280" r="50" fill="#c7c9bd" /><text x="645" y="365" ><tspan x="645" dy="0">锅灶另配</tspan></text><line x1="570" y1="225" x2="590" y2="225" stroke-width="10" stroke="#f6f2e8"/><path d="M485 630L485 465L360 465L360 340" fill="none" class="route" marker-end="url(#arrow)" /><text x="465" y="605" class="route-label"><tspan x="465" dy="0">伤员可行通路</tspan></text><g transform="translate(760 450) rotate(180)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="740" y="490" class="small"><tspan x="740" dy="0">告别镜头</tspan></text><line x1="185" y1="185" x2="90" y2="75" class="leader"/><circle cx="185" cy="185" r="4" fill="#a86040" stroke="none"/><text x="98" y="69" text-anchor="start"><tspan x="98" dy="0">床位靠墙留通道</tspan></text><text x="145" y="640" class="small"><tspan x="145" dy="0">煎鱼与养伤共用小屋；生活物件由道具分册提供</tspan></text></g>
<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">归港后的阿禾养伤、杜七追问与饭桌告</text><text x="1050" y="237" class="small">别，作为有限剧情室内复用。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">1626前后闽海岸上，灰泥/旧木隔面、</text><text x="1050" y="458" class="small">漏光门口、粗石地，伤员活动通道通向</text><text x="1050" y="487" class="small">码头；锅碗床桌均另配。</text>
