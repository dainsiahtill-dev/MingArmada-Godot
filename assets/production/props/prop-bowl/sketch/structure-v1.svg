<title id="title">饭碗与小碗：可编辑外观说明草图</title>
<desc id="desc">朴素陶瓷碗、外撇口与低足，单手可握；饭粒装载节点独立，成人／儿童共用小幅比例变体。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
