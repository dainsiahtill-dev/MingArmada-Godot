<title id="title">火把：可编辑外观说明草图</title>
<desc id="desc">短木柄与布束头，抓点远离燃烧效果，熄灭时仍可辨；火焰与烟单独效果，不画配制或点火教学。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
