<title id="title">淡水大桶：可编辑外观说明草图</title>
<desc id="desc">腰鼓形木板桶、木／金属箍、桶塞与搬抬抓位；完整、裂缝和补缝可辨，体量显著大于提水小桶。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
