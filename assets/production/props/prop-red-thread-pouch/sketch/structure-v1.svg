<title id="title">红线袋：可编辑外观说明草图</title>
<desc id="desc">掌心软布袋，红线抽口或缝线、旧补丁与软塌边；手指抓口点、腰带系点和展开时的取图口明确。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
