<title id="title">长橹与应急长桨：可编辑外观说明草图</title>
<desc id="desc">细长木柄与宽窄适中的桨叶，握位和支承处因长橹／手桨区分；与船、人比例可读，不以同杆贴图充当不同叶形。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
