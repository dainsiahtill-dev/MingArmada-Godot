<title id="title">香料货包：可编辑外观说明草图</title>
<desc id="desc">小扎口粗布货包，少量干燥香料颗粒仅作展示，封记与开袋抓点清楚；不使用现代塑封与标签。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
