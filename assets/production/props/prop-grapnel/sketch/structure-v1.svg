<title id="title">接舷挠钩与钩索：可编辑外观说明草图</title>
<desc id="desc">小型多爪铁钩、中央绳环和短索；绳接点、投放抓点与船舷接触处可读，不画现代登山锁扣。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
