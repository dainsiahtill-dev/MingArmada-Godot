<title id="title">衣物行李箱：可编辑外观说明草图</title>
<desc id="desc">朴素木箱或漆木衣箱、平盖、侧把手和扣件，体量允许两人搬抬；箱盖铰点、抓位与落地边清楚。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
