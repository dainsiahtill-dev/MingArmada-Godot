<title id="title">瓷货罐：可编辑外观说明草图</title>
<desc id="desc">短颈圆腹瓷罐、平稳底足、简盖或包口；釉色低饱和，货运可外加草绳／衬垫节点，手持点在罐腹。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
