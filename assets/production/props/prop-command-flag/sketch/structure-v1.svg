<title id="title">保护旗、官旗与号令旗：可编辑外观说明草图</title>
<desc id="desc">简布旗、绳套／系点与可拆旗杆，破边、补片和记号可辨；设计旗面避免现代国家旗或后世军旗，视觉须连同人物视距审查。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
