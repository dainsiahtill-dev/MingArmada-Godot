<title id="title">备用火绳：可编辑外观说明草图</title>
<desc id="desc">柔软粗绳束，小幅盘卷与可抓自由端，干湿状态通过材质和UI说明区别；余火为效果小点。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
