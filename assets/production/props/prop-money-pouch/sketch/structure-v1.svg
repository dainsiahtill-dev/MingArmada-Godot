<title id="title">家用与交银钱袋：可编辑外观说明草图</title>
<desc id="desc">小布袋、扎绳与自然鼓褶，手持抛放点清楚；口袋可少量露出钱串，避免电子游戏金币满溢。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
