<title id="title">床铺与被褥：可编辑外观说明草图</title>
<desc id="desc">低矮铺位与折叠／铺展被褥，织物压褶和贴地关系自然；坐卧接触区、枕位与角色尺度一致。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
