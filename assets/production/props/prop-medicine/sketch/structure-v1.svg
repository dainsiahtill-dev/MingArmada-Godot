<title id="title">随船药囊与裹伤布：可编辑外观说明草图</title>
<desc id="desc">小布／油纸药包、朴素扎带及独立干净布条，袋口与递物抓点清楚；不使用现代十字急救包、玻璃注射器或现代药盒。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
