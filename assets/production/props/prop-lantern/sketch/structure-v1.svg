<title id="title">船灯与提灯：可编辑外观说明草图</title>
<desc id="desc">小型木／竹或金属框灯，护罩、提环和悬挂点明确；暖色内光，灭灯仍有完整轮廓。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
