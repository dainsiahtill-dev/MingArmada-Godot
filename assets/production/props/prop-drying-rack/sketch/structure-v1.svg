<title id="title">渔网晾晒架：可编辑外观说明草图</title>
<desc id="desc">粗木双架、横杆与挂网点，结构轻、海风旧化；挂网引用prop-cargo-net的独立绳网变体，避免现代金属晾衣架。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
