<title id="title">铁料货组：可编辑外观说明草图</title>
<desc id="desc">少量朴素铁块／条坯、粗锻表面、绳捆或木托，体量可搬；避免现代钢卷、螺纹钢和工业标准锭标。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
