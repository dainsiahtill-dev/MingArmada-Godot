<title id="title">木桌：可编辑外观说明草图</title>
<desc id="desc">简木桌面、四腿与横撑，边缘磨损；纸、碗、刀等放置面清楚，避免明清宫廷家具装饰。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
