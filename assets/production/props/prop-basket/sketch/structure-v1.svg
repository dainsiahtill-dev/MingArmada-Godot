<title id="title">货物竹篮：可编辑外观说明草图</title>
<desc id="desc">竹编开口筐，弧形提手为可选节点，粗编纹理与底圈清楚；空篮可叠放，盛果只组合现有内容。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
