<title id="title">破船木段：可编辑外观说明草图</title>
<desc id="desc">断裂厚木板与短梁组合，毛边、湿木、焦黑可读；漂浮重心、救援抓点与碰撞边保留简洁。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
