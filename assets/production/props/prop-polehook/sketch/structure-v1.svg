<title id="title">长钩与篙钩：可编辑外观说明草图</title>
<desc id="desc">长木杆与窄铁钩头，钩尖克制、轮廓显著区别枪头；双手抓点、钩索接触点和甲板倚靠处明确。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
