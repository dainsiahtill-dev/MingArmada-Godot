<title id="title">缺口木筹：可编辑外观说明草图</title>
<desc id="desc">掌心大小木片，唯一明显缺口、旧刻痕、磨圆边；可捏持边、挂绳孔如采用须审查，避免现代令牌徽章样式。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
