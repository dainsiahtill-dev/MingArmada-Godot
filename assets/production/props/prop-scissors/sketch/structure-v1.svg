<title id="title">剪刀：可编辑外观说明草图</title>
<desc id="desc">朴素金属双刃与双环柄，铰点、单手抓位清楚，使用磨损克制；不画现代塑料包胶柄。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
