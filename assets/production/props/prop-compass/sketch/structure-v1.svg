<title id="title">铜制罗盘：可编辑外观说明草图</title>
<desc id="desc">掌上圆盘或小方座、朴素金属边、纸／木刻盘面，磁针与玻璃罩是否采用需史料审查；手持抓边与桌面放置面明确。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
