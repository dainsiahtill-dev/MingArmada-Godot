<title id="title">提水小桶：可编辑外观说明草图</title>
<desc id="desc">直壁或稍收底木桶、弧形提梁、桶口可见；单手握点与倒水转轴清楚，不用现代塑料或镀锌铁桶。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
