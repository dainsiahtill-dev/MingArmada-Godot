<title id="title">船匠断索斧：可编辑外观说明草图</title>
<desc id="desc">朴素铁斧头、直木柄、握持磨损；双手抓点与甲板放置面清楚，比例可用于船务劳作，不用巨型战斧。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
