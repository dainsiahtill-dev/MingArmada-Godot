<title id="title">钱串与小银块：可编辑外观说明草图</title>
<desc id="desc">少量方孔铜钱串与朴素不规则小银块，不作统一巨大元宝；留手指捏取与袋内装载点。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
