<title id="title">布匹货包与布卷：可编辑外观说明草图</title>
<desc id="desc">柔软长方布包或卷布、外层包布、绳扎与小封记；货包体量以双手抬抱为准，留可拆封处。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
