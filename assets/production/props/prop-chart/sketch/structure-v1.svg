<title id="title">船图、针路簿与水程笺：可编辑外观说明草图</title>
<desc id="desc">旧纸张／薄册、朴素墨线、折痕与软毛边；歪船图保留母画船身、幼儿后添帆的叙事，不画现代等高线海图。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
