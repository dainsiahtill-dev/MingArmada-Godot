<title id="title">停火铜锣：可编辑外观说明草图</title>
<desc id="desc">小型圆铜锣、顶端挂绳与木槌；锣面浅鼓、提握点与敲击动作空间清楚，不装现代音响支架。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
