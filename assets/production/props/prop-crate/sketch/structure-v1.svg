<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">木货箱：可编辑外观说明草图</title>
<desc id="desc">人可双手搬动的方木箱，拼板与木扣克制，留绑索与封条位置；盖板与箱体分节点，箱角能体现撞裂。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
