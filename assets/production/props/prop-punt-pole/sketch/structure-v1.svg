<title id="title">撑船篙：可编辑外观说明草图</title>
<desc id="desc">长直竹／木杆、自然节理、末端磨损，纤细可折；双手持位与水面接触点明确，无枪刃和桨叶。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
