<title id="title">平户手糊纸灯：可编辑外观说明草图</title>
<desc id="desc">轻竹架、薄纸罩、明显补纸一角与提拿点；轮廓克制，双手护灯点清楚，不用现代节庆塑料灯或宫灯大穗。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
