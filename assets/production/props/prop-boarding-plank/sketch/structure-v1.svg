<title id="title">接舷过板与跳板：可编辑外观说明草图</title>
<desc id="desc">窄厚长木板、少量横条或边索，端部搭接区明确；按成人通行宽和两船高差审查，不画现代扶手舷梯。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
