<title id="title">锅具：可编辑外观说明草图</title>
<desc id="desc">朴素圆腹铁锅／陶锅、双耳或提梁、锅沿与烟熏底；放置与手提挂点清楚。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
