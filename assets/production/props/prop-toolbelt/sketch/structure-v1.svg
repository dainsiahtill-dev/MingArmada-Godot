<title id="title">旧工具带：可编辑外观说明草图</title>
<desc id="desc">粗布带、补丁与挂环，少量木柄手工具挂位；腰部绑点、拆下放置轮廓和女儿补缝区别明确。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
