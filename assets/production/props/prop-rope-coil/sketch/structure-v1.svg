<title id="title">盘索与备用缆绳：可编辑外观说明草图</title>
<desc id="desc">粗麻绳绞股、自然盘卷；自由端、环扣与连接点明确，卷径依人手和甲板尺度核查。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
