<title id="title">阿旺工具箱：可编辑外观说明草图</title>
<desc id="desc">紧凑旧木箱、提把、扣带和磨损棱角，内部简单分隔；单／双手抓点、箱盖铰点与地面放置面清楚。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
