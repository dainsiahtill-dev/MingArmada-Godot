<title id="title">坐凳与长凳：可编辑外观说明草图</title>
<desc id="desc">朴素窄木面、低横撑与榫接感，座面可容成人坐姿；坐点和双手撑点明确。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
