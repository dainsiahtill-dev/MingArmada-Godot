<title id="title">家书纸张：可编辑外观说明草图</title>
<desc id="desc">旧纸单张／折叠纸，薄、轻、边角软化；手指捏纸点、桌上展开边和折痕明确，禁现代信封邮票。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
