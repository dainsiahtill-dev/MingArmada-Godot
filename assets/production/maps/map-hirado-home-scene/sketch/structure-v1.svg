<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">小木屋的门槛、屋檐与起居间，供成家</text><text x="1050" y="237" class="small">、托信和送子镜头复用。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">近人尺度的檐下、门内起居角与可远望</text><text x="1050" y="458" class="small">港巷的出口；灯夜、孩子用品和空位由</text><text x="1050" y="487" class="small">陈设包切换，保证母子日常空间连续。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a2_s2 / a2_s3 / a2_s5 / a5_s1 / a6_s1</text>
