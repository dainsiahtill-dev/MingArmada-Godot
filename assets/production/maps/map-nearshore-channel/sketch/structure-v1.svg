<title id="title">福建暗岸、岛岸与厦门口航道差异包：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。夺快船、护货抽援、米船伏击与厦门口封锁共用近岸水道母型；每次载入自己的浅区与目标配置。所有符号与部件均为设计关系表达。</desc>
