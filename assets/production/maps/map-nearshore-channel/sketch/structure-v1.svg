<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">可辨狭口、岩岸、浅礁与一两条绕行水</text><text x="1050" y="458" class="small">路，封口、接应和外侧退路不能被装饰</text><text x="1050" y="487" class="small">挡住。</text>
