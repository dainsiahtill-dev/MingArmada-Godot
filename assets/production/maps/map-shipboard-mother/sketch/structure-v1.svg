<title id="title">甲板与有限船舱共享场景：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。读信、联盟交涉、货舱救援、接舷和折桅等发生于船上；场景必须引用船型而非另计一艘场景船。所有符号与部件均为设计关系表达。</desc>
