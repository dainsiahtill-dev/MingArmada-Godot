22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="250" y="310" class="small"><tspan x="250" dy="0">工作岸镜头</tspan></text><g transform="translate(760 420) rotate(180)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="740" y="460" class="small"><tspan x="740" dy="0">港火救援镜头</tspan></text><text x="82" y="555" ><tspan x="82" dy="0">普通泊位 / 火损泊位共享布局</tspan></text></g>
<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">受抚、补给修船、认子、港火救人和</text><text x="1050" y="237" class="small">1646分途共用工作港母布局，按地点/</text><text x="1050" y="266" class="small">年代切换岸段。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">1626—1646，有限货栈、石堤、木泊</text><text x="1050" y="458" class="small">位、修船支架、官署热点和居所入口；</text><text x="1050" y="487" class="small">港内水面须容小艇救援，普通泊位/火</text><text x="1050" y="516" class="small">损泊位通过状态差异读清。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a3_s4 / a3_s5 / a4_s1 / a4_s2 / a4_s4 / a5_s2 / a5_s3 / a6_s4 / a6_s5</text>
