<title id="title">福建工作港与厦门泊区差异包：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。受抚、补给修船、认子、港火救人和1646分途共用工作港母布局，按地点/年代切换岸段。所有符号与部件均为设计关系表达。</desc>
