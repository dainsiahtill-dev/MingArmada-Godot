<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">战术封口、护货、回援、火攻和双船接</text><text x="1050" y="237" class="small">舷的共享图层语法；每场载入差异配置</text><text x="1050" y="266" class="small">。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">俯视海面/海岸简形、船影、射界、潮</text><text x="1050" y="458" class="small">风、危险浅区、接应承诺和撤出线分层</text><text x="1050" y="487" class="small">；接舷图保留双船、过板、甲板、舱门</text><text x="1050" y="516" class="small">，文字和标记矢量化。</text>
