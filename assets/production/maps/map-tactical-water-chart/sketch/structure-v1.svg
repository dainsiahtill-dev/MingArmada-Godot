<title id="title">海战与接舷态势底图：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。战术封口、护货、回援、火攻和双船接舷的共享图层语法；每场载入差异配置。所有符号与部件均为设计关系表达。</desc>
