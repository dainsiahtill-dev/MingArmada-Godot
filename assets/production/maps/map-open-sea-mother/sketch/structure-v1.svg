<rect x="48" y="146" width="970" height="694" fill="#fffdf7" stroke="#c7c9bd" stroke-width="1.2"/>
<g transform="translate(50 155)"><rect x="12" y="20" width="944" height="596" fill="#d8e8e8" /><text x="30" y="643" class="small"><tspan x="30" dy="0">青绿虚线：浅区　红箭头：航路 / 任务线　圆锥：镜头锚点</tspan></text><text x="30" y="669" class="small"><tspan x="30" dy="0">布局关系示意；无真实经纬坐标，岸线与水深均待制作验证</tspan></text><path d="M12 20H225L180 55 125 60 95 100 12 135Z" fill="#ddcda9" /><path d="M830 20H956V120L920 95 875 100Z" fill="#ddcda9" /><path d="M20 165Q150 130 235 65M800 60Q860 140 945 150" fill="none" class="shallow"/><path d="M120 260Q350 230 590 260T900 260M80 440Q330 410 590 440T900 440" fill="none" class="waterline"/><path d="M170 540Q395 490 540 360T825 200" fill="none" class="route" marker-end="url(#arrow)" /><text x="360" y="540" class="route-label"><tspan x="360" dy="0">连续主航行空间</tspan></text><g transform="translate(520 375) rotate(-35) scale(1)"><path d="M-44 0Q-28-19 23-16L48 0 23 16Q-28 19-44 0Z" fill="#fffdf7" /><line x1="-26" y1="0" x2="23" y2="0" /><line x1="0" y1="-16" x2="0" y2="16" /><circle cx="0" cy="0" r="4" fill="#d9c3a0" /></g><g transform="translate(310 465) rotate(-20)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="290" y="505" class="small"><tspan x="290" dy="0">追船镜头</tspan></text><g transform="translate(730 340) rotate(-120)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="710" y="380" class="small"><tspan x="710" dy="0">海平线镜头</tspan></text><rect x="65" y="190" width="205" height="80" fill="#f6f2e8" /><text x="167.5" y="237" text-anchor="middle"><tspan x="167.5" dy="0">远岸可显隐</tspan></text><text x="587.12" y="585" ><tspan x="587.12" dy="0">雾 / 无风 / 横浪 / 昼夜为条件包</tspan></text></g>
<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">跨六幕共享的可操船海域、海天与遭遇</text><text x="1050" y="237" class="small">空间；雾、无风、风暴、日夜、战后搜</text><text x="1050" y="266" class="small">索是条件包。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">船尺度下连续海面，远岸按需显隐；海</text><text x="1050" y="458" class="small">平线、天空、可见度、风浪和航行空间</text><text x="1050" y="487" class="small">先保持一致；船和碰撞水深作为独立数</text><text x="1050" y="516" class="small">据，不用剧情画面反推真实里程。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a1_s3 / a1_s6 / a2_s8 / a2_s6 / a2_s7 / a2_s4 / a2_s5 / a3_s1 / a3_s9 / a3_s2 / …</text>
