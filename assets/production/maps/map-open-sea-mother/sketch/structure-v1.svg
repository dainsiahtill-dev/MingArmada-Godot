<title id="title">可航行外海母场景：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。跨六幕共享的可操船海域、海天与遭遇空间；雾、无风、风暴、日夜、战后搜索是条件包。所有符号与部件均为设计关系表达。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a86040"/></marker></defs>
