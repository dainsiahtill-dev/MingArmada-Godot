<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">平户川内浦港巷与石堤差异包：可编辑技术草图</title>
<desc id="desc">概念结构示意，非实测比例，非历史实址或精确复原。提水相识、送别和跨年候船的岸边空间；与小木屋场景连在同一有限港区。所有符号与部件均为设计关系表达。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a86040"/></marker></defs>
<style>
svg{background:#f6f2e8}text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-size:22px;fill:#273d40;stroke:none}path,rect,polygon,line,circle{stroke:#273d40;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#637573}.tag{font-size:21px;font-weight:700}.small{font-size:18px}.fine{stroke-width:1.3;opacity:.7}.leader{stroke:#637573;stroke-width:1.6;fill:none}.route{stroke:#a86040;stroke-width:4;fill:none}.route-label{font-size:20px;fill:#a86040}.interface{stroke-dasharray:8 7;stroke:#557c88}.shallow{stroke:#b9d5d0;stroke-width:17;stroke-dasharray:15 8;fill:none}.waterline{stroke:#557c88;stroke-width:2;stroke-dasharray:13 9}.rope{stroke:#a86040;stroke-width:2;stroke-dasharray:6 5;fill:none}.swing{stroke:#a86040;stroke-dasharray:8 8;fill:none}.silhouette{stroke-dasharray:13 9;stroke:#637573;stroke-width:2}.ground{stroke-width:3}.window{stroke:#557c88;stroke-width:7}.drip{stroke:#557c88;stroke-dasharray:7 9;stroke-width:4}.anchor-zone{stroke:#557c88;stroke-dasharray:8 10;stroke-width:1.5}.search{stroke:#557c88;stroke-dasharray:10 8;stroke-width:2}.contour{stroke:#637573;stroke-dasharray:7 6;stroke-width:2}.horizon{stroke:#637573;stroke-width:2}.fog{stroke:#fffdf7;stroke-width:9;opacity:.7}.rain{stroke:#557c88;stroke-width:2}
</style>
<rect x="0" y="0" width="1440" height="1000" fill="#f6f2e8" stroke="none"/>
<text x="48" y="61" class="title">平户川内浦港巷与石堤差异包</text>
<text x="49" y="98" class="subtitle">map-hirado-kawachi-harbor · 可玩空间与镜头关系</text>
<line x1="48" y1="122" x2="1390" y2="122" stroke="#637573" stroke-width="1"/>
<rect x="48" y="146" width="970" height="694" fill="#fffdf7" stroke="#c7c9bd" stroke-width="1.2"/>
<g transform="translate(50 155)"><rect x="12" y="20" width="944" height="596" fill="#d8e8e8" /><text x="30" y="643" class="small"><tspan x="30" dy="0">青绿虚线：浅区　红箭头：航路 / 任务线　圆锥：镜头锚点</tspan></text><text x="30" y="669" class="small"><tspan x="30" dy="0">布局关系示意；无真实经纬坐标，岸线与水深均待制作验证</tspan></text><path d="M12 20H510L530 115 465 190 485 265 390 345 325 440 235 475 12 485Z" fill="#ddcda9" /><rect x="130" y="110" width="210" height="105" fill="#d9c3a0" /><text x="235" y="169.5" text-anchor="middle"><tspan x="235" dy="0">木屋与港巷</tspan></text><path d="M310 245L450 245 375 370 310 400" fill="none" stroke-width="20"/><path d="M600 35Q645 180 515 320L390 500 255 550" fill="none" class="shallow"/><g transform="translate(565 410) rotate(55) scale(1)"><path d="M-44 0Q-28-19 23-16L48 0 23 16Q-28 19-44 0Z" fill="#fffdf7" /><line x1="-26" y1="0" x2="23" y2="0" /><line x1="0" y1="-16" x2="0" y2="16" /><circle cx="0" cy="0" r="4" fill="#d9c3a0" /></g><path d="M190 230L310 305L420 330L550 410" fill="none" class="route" marker-end="url(#arrow)" /><text x="135" y="570" class="route-label"><tspan x="135" dy="0">搬桶 / 候船路径</tspan></text><g transform="translate(360 410) rotate(-30)"><circle cx="0" cy="0" r="14" fill="#fffdf7" /><polygon points="12,-9 39,-22 39,22 12,9" fill="none" class="leader"/><circle cx="0" cy="0" r="4" fill="#a86040" /></g><text x="340" y="450" class="small"><tspan x="340" dy="0">石堤候船</tspan></text><text x="600" y="225" ><tspan x="600" dy="0">商船泊向</tspan></text><circle cx="420" cy="320" r="8" fill="#d9c3a0" /><circle cx="420" cy="320" r="16" fill="none" class="fine"/></g>
<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">提水相识、送别和跨年候船的岸边空间</text><text x="1050" y="237" class="small">；与小木屋场景连在同一有限港区。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">约1623—1645，窄石阶、石堤、朴素</text><text x="1050" y="458" class="small">木屋檐线与商船泊向；以可搬桶走过的</text><text x="1050" y="487" class="small">生活路径为尺度，城楼如无必要不纳入</text><text x="1050" y="516" class="small">可玩区。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a2_s1 / a2_s3 / a5_s1 / a6_s1</text>
