<text x="1050" y="174" class="tag">资源用途</text><text x="1050" y="208" class="small">认父、读书、团聚、断盟与分途的有限</text><text x="1050" y="237" class="small">家居/门口场景；养伤屋用同一室内构</text><text x="1050" y="266" class="small">件体系的另一装配。</text>
<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">屋内两三处人物工作位、门槛、门外登</text><text x="1050" y="458" class="small">船方向构成动线；1630/1645/1646通</text><text x="1050" y="487" class="small">过摆设与角色年龄变化区分；不按每次</text><text x="1050" y="516" class="small">家事新增宅院。</text>
<text x="1050" y="654" class="tag">计数边界</text><text x="1050" y="688" class="small">装配 / 条件资源；不新增独立基模</text>
<text x="50" y="884" class="tag">概念结构示意 · 非实测比例 · 非历史实址 / 非精确历史复原</text>
<text x="50" y="925" class="small">只表达部件、空间、通路与镜头关系；图面位置不代表真实尺寸、水深、经纬度或史实炮位。</text>
<text x="50" y="962" class="small">关联剧情：a3_s4 / a3_s5 / a4_s5 / a5_s2 / a6_s2 / a6_s3</text>
