<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">宽水面、低远岸或沙岸、临时锚泊船位</text><text x="1050" y="458" class="small">与近艇会合区；雾浓淡/吃水差别可读</text><text x="1050" y="487" class="small">，岸线为制作布局；不默认加入热兰遮</text><text x="1050" y="516" class="small">城全套城堡或市镇。</text>
