<text x="1050" y="395" class="tag">制作关注</text><text x="1050" y="429" class="small">砂、湿砂、干岩、湿岩和潮水线的低频</text><text x="1050" y="458" class="small">颜色/粗糙度差异；重复尺度按人/船</text><text x="1050" y="487" class="small">比对，细节不抢战术可读性；纹理并非</text><text x="1050" y="516" class="small">独立几何。</text>
