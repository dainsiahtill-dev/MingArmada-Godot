<title id="title">佛朗机子铳：可编辑外观说明草图</title>
<desc id="desc">短粗金属杯筒与把手轮廓，后端厚实；作为手持部件提供抓握点和母铳后框对位点，仅交外观。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
