<title id="title">红夷式重炮炮身：可编辑外观说明草图</title>
<desc id="desc">比轻炮显著粗重而修长，前部收窄、后段厚重，节箍、炮耳、尾钮可读；炮耳和尾部索具为挂点，单独交炮身。禁止19世纪调高螺杆、后装闭锁和清代制式装饰。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
