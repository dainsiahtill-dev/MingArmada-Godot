<title id="title">佛朗机炮身：可编辑外观说明草图</title>
<desc id="desc">细长金属管、开放的后部框状轮廓、两侧炮耳与尾柄，母铳形体明确；尾柄为操控挂点，炮耳对旋架。子铳单列，禁止现代后膛闭锁、枪托或清代龙纹铭款。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
