<title id="title">船载轻型前装炮炮身：可编辑外观说明草图</title>
<desc id="desc">以成年炮手为比例，紧凑长管、前细后厚、简节箍、两侧炮耳和尾部轮廓；铁或铜材质作变体。炮耳为炮架挂点，炮身与架分交；不绘内部制造结构。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
