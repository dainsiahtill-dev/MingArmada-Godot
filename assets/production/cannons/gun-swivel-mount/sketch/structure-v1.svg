<title id="title">佛朗机叉式旋架与甲板座：可编辑外观说明草图</title>
<desc id="desc">金属U形叉架承接两侧炮耳，下部有竖直支轴，木质船舷插座作小型独立节点；叉架、支轴和船舷连接处可读，避免现代云台造型。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
