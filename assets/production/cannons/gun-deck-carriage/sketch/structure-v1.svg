<title id="title">轮式木炮架：可编辑外观说明草图</title>
<desc id="desc">低矮厚木侧板、横梁和木轮，铁件朴素；炮耳座、轮轴、甲板系索点分明；完整与断轴节点可切换。先按炮手和甲板比例审查，不输出工程尺寸。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
