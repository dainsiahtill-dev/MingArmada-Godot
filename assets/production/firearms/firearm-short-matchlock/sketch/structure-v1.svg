<title id="title">短铳（暂定短火绳枪形制）：可编辑外观说明草图</title>
<desc id="desc">较短金属管与近直短木柄、侧面火绳夹为暂定外轮廓；单／双手抓点须以角色动作核查。装饰克制，不使用19世纪左轮、燧发海盗手枪或江户中晚期华饰短筒。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
