<title id="title">鸟铳与长火绳枪：可编辑外观说明草图</title>
<desc id="desc">长细钢铁管搭配木托，侧面火绳夹轮廓清楚，肩托形式按同代区域样本审查；双手、背带和腰侧火绳为角色挂点。禁止燧发机构、雷管、现代导轨及后世清代豪华御用样式。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
