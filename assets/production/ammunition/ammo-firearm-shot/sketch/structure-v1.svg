<title id="title">个人火器弹丸袋：可编辑外观说明草图</title>
<desc id="desc">小型朴素布袋与少量可见圆丸，袋口、腰带系点和手持抓点可读；不画现代金属定装弹。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
