<title id="title">实心炮弹：可编辑外观说明草图</title>
<desc id="desc">单枚深色金属球、局部旧化；可成小堆与木托组合，按炮与手掌比例核查。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
