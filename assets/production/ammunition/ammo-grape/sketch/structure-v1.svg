<title id="title">葡萄弹包：可编辑外观说明草图</title>
<desc id="desc">多枚小金属球被布／绳束成紧凑包，封装外观为主；不绘配方、内部装填或数量参数。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
