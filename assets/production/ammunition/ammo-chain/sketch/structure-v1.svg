<title id="title">链弹：可编辑外观说明草图</title>
<desc id="desc">成对端部由松弛铁链相连，收拢与展开配置保持同一连接关系；不与普通圆弹混淆。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
