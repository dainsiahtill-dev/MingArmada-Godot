<title id="title">雇佣刀手长刀：可编辑外观说明草图</title>
<desc id="desc">长单刃略弧刀身、可双手握持的长柄、简护手与木鞘；刃与柄的长度差别明确，双手抓点和鞘挂点可见；避免奇幻超宽刀。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
