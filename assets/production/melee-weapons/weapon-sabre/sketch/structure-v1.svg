<title id="title">随身短刀与刀鞘：可编辑外观说明草图</title>
<desc id="desc">单刃短刀、窄护手、朴素双片或缠柄、木鞘；刃长与成人前臂形成紧凑关系。左右腰带挂点、拔刀手位和收鞘点明确，不用清代制式大刀或现代军刀。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
