<title id="title">守船长枪：可编辑外观说明草图</title>
<desc id="desc">长直木杆、窄金属枪头、简短套箍；两手抓点与甲板通道净空需可读；穗可省，避免奇幻巨刃和夸张红缨。 可编辑外观说明草图；形制待证，不是写实概念图、史实复原或正式3D验收；仅整体轮廓、材质分区、挂点与节点关系。火炮火器无内部机构、尺寸、装药、制造或操作步骤。</desc>
