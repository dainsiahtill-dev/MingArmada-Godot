[WAKE]

; WakeCreateTime		- The time between creating new waypoints
; WakeCreateDistance	- The needed distance between creaing wake waypoints
; WakeDestroyTime		- The time after which a waypoint will be destroyed
; WakeTexture			- The texture applied to the wake geometry
; WaktTextureScaling	- Inversely proportional to the size of the wake texture applied on the wake
; RenderWaypointLines (boolean)	- If true, renders the line connecting the waypoints (debug build only)

WakeWaypoints			=	50
WakeCreateTime			=	0.025
WakeCreateDistance		=	20.0
WakeDestroyTime			=	0.04
WakeTexture				=	Wake3unique.dds
WakeTextureScaling		=	-750.0
WakeMaximumWidth		=	150.0
RenderWaypointLines		=	0

; WakeSpreadFunc		- The image defining a f(x) function for the spread of the wake (x = waypoint #)
; WakeSpreadFuncScale	- The scaling of the spread function output
; WakeSpreadFuncOffset	- The value added to the prescaled output value

WakeSpreadFunc			=	WakeSpreadFunc.bmp
WakeSpreadFuncScale		=	250.0
WakeSpreadFuncOffset	=	1.0

; WakeAlphaFunc			- The image defining a f(x,y) function for the alpha of the wake (x = waypoint age)
; ...

WakeAlphaFunc			=	WakeAlphaFunc.bmp
WakeAlphaFuncScale		=	1.0
WakeAlphaFuncOffset		=	0.0
